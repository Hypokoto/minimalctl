[package]
name = "minimalctl"
version = "0.1.0"
edition = "2021"
authors = ["Hypokoto <hypokoto@minimal>"]
description = "Native control plane and theme compiler for Minimal OS Shell"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "6.1"
similar = "2.4"

[[bin]]
name = "minimalctl"
path = "src/main.rs"

[lib]
name = "minimal_nvim"
path = "src/nvim_ffi/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "minimal-ide"
path = "src/ide/main.rs"

[build-dependencies]
cc = "1.0"
