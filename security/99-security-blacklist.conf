# Security Hardening: Kernel Module Blacklist
# Mitigates Lynis Suggestions: NETW-3200, STRG-1846

# Disable uncommon/legacy network protocols (prevents exploitation of obscure networking stacks)
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true

# Disable firewire storage (prevents DMA attacks via firewire)
install firewire-core /bin/true
install algif_aead /bin/true
