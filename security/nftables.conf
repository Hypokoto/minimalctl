#!/usr/sbin/nft -f

table inet minimal_filter { }
flush table inet minimal_filter

table inet minimal_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback traffic
        iifname "lo" accept

        # Allow established and related connections
        ct state established,related accept

        # Drop invalid connections
        ct state invalid drop

        # Allow essential ICMP
        ip protocol icmp accept

        # VPN / Lab interfaces - allow reverse shells and SSH
        iifname "tun0" accept

        # mDNS - Multicast local discovery (LAN only)
        udp dport 5353 pkttype multicast accept

        # libvirt / KVM Host Networking (virbr0)
        # Allows guest VMs to access host-provided DNS/DHCP (ports 53, 67)
        iifname "virbr0" accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # libvirt manages its own forwarding rules via iptables-nft/hooks,
        # but we explicitly drop unauthorized host forwarding.
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
