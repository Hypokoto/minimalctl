# Security Hardening & CVE Mitigations
# Applied via minimal dotfiles security layer

# ------------------------------------------------------------------------------
# 1. Network & IPv6 (Mitigates August 2026 CVE-2026-53362 if kernel is unpatched)
# NOTE: The strongest IPv6 disable is ipv6.disable=1 on kernel cmdline.
# LAB WARNING: IPv6 off breaks IPv6 labs.
# ------------------------------------------------------------------------------
# Disable IPv6 completely unless explicitly required
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Ignore ICMP echo requests (ping)
# LAB WARNING: Breaks ping-based diagnostics
net.ipv4.icmp_echo_ignore_all = 1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable sending redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ------------------------------------------------------------------------------
# 2. Kernel & Memory Protections
# ------------------------------------------------------------------------------
# Restrict access to kernel pointers (prevents kernel address leaks)
kernel.kptr_restrict = 2

# Restrict dmesg access to privileged users only
kernel.dmesg_restrict = 1

# Disable unprivileged BPF (eBPF attacks)
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT compiler
net.core.bpf_jit_harden = 2

# Protect ptrace (restrict process tracing)
# LAB WARNING: Blocks gdb -p and strace -p on non-child processes
kernel.yama.ptrace_scope = 1

# Disable kexec (prevents replacing the running kernel)
kernel.kexec_load_disabled = 1

# Disable TTY line discipline autoloading
dev.tty.ldisc_autoload = 0

# ------------------------------------------------------------------------------
# 3. File System Protections (Mitigates local privesc vectors)
# ------------------------------------------------------------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Disable core dumps for setuid processes
fs.suid_dumpable = 0

# ------------------------------------------------------------------------------
# 4. Anti-Spoofing & ASLR
# ------------------------------------------------------------------------------
# Reverse path filtering — drop packets with spoofed source addresses
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Full Address Space Layout Randomization
kernel.randomize_va_space = 2

# ------------------------------------------------------------------------------
# 5. Virtual Memory & ZRAM Optimization
# Aggressively offload idle memory pages to compressed ZRAM using CPU cycles
# ------------------------------------------------------------------------------
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
